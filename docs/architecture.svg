<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Vibekill architecture</title>
  <desc id="desc">Local Git and GitHub PR sources feed deterministic analysis, four parallel LangGraph agents, evidence-gated aggregation, and UI, API, CLI, and report outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.subtitle{font:14px system-ui,sans-serif;fill:#94a3b8}
      .section{font:700 12px system-ui,sans-serif;letter-spacing:1.5px;fill:#94a3b8}.box{fill:#1e293b;stroke:#334155;stroke-width:1.5;rx:10;filter:url(#shadow)}
      .box-title{font:650 16px system-ui,sans-serif;fill:#f1f5f9}.box-copy{font:12px system-ui,sans-serif;fill:#94a3b8}.pill{fill:#293548;stroke:#475569;rx:17}.pill-text{font:600 12px system-ui,sans-serif;fill:#dbeafe}
      .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.small{font:11px system-ui,sans-serif;fill:#64748b}.number{font:700 12px system-ui,sans-serif;fill:#c4b5fd}
    </style>
  </defs>
  <rect width="1200" height="760" rx="16" fill="url(#bg)"/>
  <text x="55" y="55" class="title">💀 vibekill</text>
  <text x="55" y="82" class="subtitle">Kills the vibe before your diff kills production · one review engine, two source modes</text>

  <text x="55" y="125" class="section">1 · INPUT</text>
  <rect x="55" y="145" width="250" height="92" class="box"/>
  <text x="78" y="178" class="box-title">Local Git</text>
  <text x="78" y="201" class="box-copy">Default · no network</text>
  <text x="78" y="220" class="box-copy">Commits or working tree</text>
  <rect x="345" y="145" width="250" height="92" class="box"/>
  <text x="368" y="178" class="box-title">GitHub PR</text>
  <text x="368" y="201" class="box-copy">Fetch-only connected mode</text>
  <text x="368" y="220" class="box-copy">GitHub + model hosts allowlisted</text>
  <path d="M305 191 H345" class="arrow"/>
  <rect x="690" y="145" width="330" height="92" class="box"/>
  <text x="713" y="178" class="box-title">ReviewContext</text>
  <text x="713" y="201" class="box-copy">Unified diff · line numbers · repository metadata</text>
  <text x="713" y="220" class="box-copy">One contract isolates source-specific behavior</text>
  <path d="M595 191 H690" class="arrow"/>

  <text x="55" y="287" class="section">2 · FACTS FIRST</text>
  <rect x="55" y="307" width="965" height="105" class="box"/>
  <text x="78" y="339" class="box-title">Deterministic analysis</text>
  <text x="78" y="362" class="box-copy">Runs before the model. Missing external tools never abort a review.</text>
  <rect x="78" y="378" width="138" height="28" class="pill"/><text x="147" y="397" text-anchor="middle" class="pill-text">Built-in checks</text>
  <rect x="230" y="378" width="88" height="28" class="pill"/><text x="274" y="397" text-anchor="middle" class="pill-text">Ruff</text>
  <rect x="332" y="378" width="88" height="28" class="pill"/><text x="376" y="397" text-anchor="middle" class="pill-text">Bandit</text>
  <rect x="434" y="378" width="100" height="28" class="pill"/><text x="484" y="397" text-anchor="middle" class="pill-text">Semgrep</text>
  <text x="750" y="391" class="box-copy">output → evidence pack</text>
  <path d="M855 237 V307" class="arrow"/>

  <text x="55" y="462" class="section">3 · LANGGRAPH FAN-OUT</text>
  <rect x="55" y="482" width="218" height="92" class="box"/>
  <text x="78" y="516" class="box-title">🔓 Security</text><text x="78" y="541" class="box-copy">Reachable exploits and auth</text>
  <rect x="292" y="482" width="218" height="92" class="box"/>
  <text x="315" y="516" class="box-title">🐛 Quality</text><text x="315" y="541" class="box-copy">Logic and error handling</text>
  <rect x="529" y="482" width="218" height="92" class="box"/>
  <text x="552" y="516" class="box-title">🧪 Testing</text><text x="552" y="541" class="box-copy">Would the tests fail?</text>
  <rect x="766" y="482" width="254" height="92" class="box"/>
  <text x="789" y="516" class="box-title">✂ Complexity</text><text x="789" y="541" class="box-copy">Less code, fewer abstractions</text>
  <path d="M538 412 V453 H164 V482" class="arrow"/><path d="M538 453 H401 V482" class="arrow"/>
  <path d="M538 453 H638 V482" class="arrow"/><path d="M538 453 H893 V482" class="arrow"/>

  <text x="55" y="625" class="section">4 · TRUST BOUNDARY &amp; OUTPUT</text>
  <rect x="55" y="645" width="555" height="72" class="box"/>
  <text x="78" y="675" class="box-title">Evidence gate → confidence → dedup → severity policy</text>
  <text x="78" y="699" class="box-copy">Only verified, changed-line findings reach the final verdict</text>
  <path d="M538 574 V645" class="arrow"/>
  <rect x="682" y="645" width="338" height="72" fill="url(#accent)" rx="10" filter="url(#shadow)"/>
  <text x="705" y="675" class="box-title">One ReviewResult</text>
  <text x="705" y="699" style="font:12px system-ui,sans-serif;fill:#dbeafe">Streamlit · FastAPI · CLI · HTML · JSON · SARIF</text>
  <path d="M610 681 H682" class="arrow"/>

  <rect x="1050" y="145" width="3" height="572" fill="#334155"/>
  <text x="1082" y="170" class="number">DEFAULT</text>
  <text x="1082" y="191" class="small">Socket guard</text><text x="1082" y="208" class="small">blocks public</text><text x="1082" y="225" class="small">egress</text>
  <text x="1082" y="275" class="number">MVP</text>
  <text x="1082" y="296" class="small">One review</text><text x="1082" y="313" class="small">per process</text>
  <text x="1082" y="363" class="number">MODEL</text>
  <text x="1082" y="384" class="small">Ollama or any</text><text x="1082" y="401" class="small">OpenAI-compatible</text><text x="1082" y="418" class="small">local endpoint</text>
  <text x="1082" y="468" class="number">NO MODEL?</text>
  <text x="1082" y="489" class="small">Rules-only mode</text><text x="1082" y="506" class="small">still works</text>
</svg>
